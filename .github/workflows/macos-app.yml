name: macOS app

# Builds the XcodeGen-generated MetroSystem app on macOS. The .xcodeproj is
# .gitignore'd (generated from project.yml), so CI installs XcodeGen, runs
# `xcodegen generate`, then builds the app scheme. DCLixKit is a git
# submodule the app depends on, so the checkout fetches submodules.
#
# Needs the macos-26 image (Xcode 26.x default): the app targets macOS 15
# and uses macOS-15+ SwiftUI API, and current XcodeGen (2.45+) emits a
# project format (objectVersion 77) that Xcode 15 cannot read.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug, macOS)
        run: |
          xcodebuild \
            -project MetroSystem.xcodeproj \
            -scheme MetroSystem \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
