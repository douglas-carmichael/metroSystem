name: MetroSystem
options:
  bundleIdPrefix: net.dcarmichael
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  DCLixKit:
    path: DCLixKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    PRODUCT_BUNDLE_IDENTIFIER: net.dcarmichael.MetroSystem
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES

targets:
  MetroSystem:
    type: application
    platform: macOS
    dependencies:
      - package: DCLixKit
    sources:
      - path: Sources/MetroSystem
      - path: Resources/Fonts
      - path: Resources/Assets.xcassets
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/MetroSystem.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MetroSystem
        CFBundleDisplayName: Metro System
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.simulation
        NSHighResolutionCapable: true
        NSQuitAlwaysKeepsWindows: false
        NSPrincipalClass: NSApplication
        NSLocalNetworkUsageDescription: "Discover other PCC nodes and ClusterDaemon peers on your local network via Bonjour."
        NSBonjourServices:
          - _metrosys._tcp
        ATSApplicationFontsPath: "."
